name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Type-check package and tests
        run: uv run --python 3.12 mypy src tests

      - name: Check generated bindings are up to date
        run: |
          uv run --python 3.12 --extra regen ./src/scripts/generate_snapshot_model/generate.sh
          git diff --exit-code

      - name: Build, install, and verify wheel in isolated environment
        run: |
          uv build
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          CORPUS="$PWD/tests/data/sofle-2026-11-10.json"
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib, sys
          from google.protobuf import descriptor_pb2, descriptor_pool

          # Register competing top-level descriptors before importing our wheel.
          for bare in ("keymap_snapshot.proto", "keyboard.proto", "keymap.proto"):
              other = descriptor_pb2.FileDescriptorProto()
              other.name = bare
              other.package = f"someone.else.{bare.removesuffix('.proto')}"
              other.syntax = "proto3"
              other.message_type.add().name = "TotallyDifferent"
              descriptor_pool.Default().Add(other)

          before_path = list(sys.path)
          import zmk_keymap
          from zmk_keymap import dump, from_json, model, page, svg, text, to_json

          assert list(sys.path) == before_path, f"sys.path mutated: {sys.path}"
          assert "keymap_snapshot_pb2" not in sys.modules
          proto_file = pathlib.Path(zmk_keymap.__file__).parent / "proto" / "keymap_snapshot.proto"
          assert proto_file.is_file()
          PY
            "$RUNNER_TEMP/wheel-venv/bin/keymap-backup" --help >/dev/null
            "$RUNNER_TEMP/wheel-venv/bin/keymap-render" --help >/dev/null
            "$RUNNER_TEMP/wheel-venv/bin/keymap-restore" --help >/dev/null
            "$RUNNER_TEMP/wheel-venv/bin/keymap-render" "$CORPUS" -o "$RUNNER_TEMP/rendered.html"
            test -s "$RUNNER_TEMP/rendered.html"
          )
          uv run --python 3.12 --no-project python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          assert "zmk_keymap/proto/keymap_snapshot.proto" in names
          assert "zmk_keymap/proto/keymap_snapshot_pb2.pyi" in names
          assert "zmk_keymap/py.typed" in names
          assert not any(n.startswith(("scripts/", "tests/", "snapshots/")) for n in names)
          assert any(n.endswith("/licenses/LICENSE") for n in names)
          PY
